name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          zip -r "dist/DashboardPlusForRoblox-${{ steps.version.outputs.version }}.zip" manifest.json background.js features icons

      - uses: actions/upload-artifact@v4
        with:
          name: DashboardPlusForRoblox-${{ steps.version.outputs.version }}
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --generate-notes
